# 每次推到 main：先跑全部测试，通过了才部署。
# 线上 /info 返回的 commit 就是这里部署的那一个 —— 任何人都能拿它对照仓库里的源码。
#
# 需要在仓库 Settings → Secrets 里配置：
#   CLOUDFLARE_API_TOKEN   只给 Workers 部署权限的 API Token（不要用 Global API Key）
# APNs 私钥不经过 CI：它通过 `wrangler secret put APNS_KEY_P8` 一次性存在 Cloudflare 上。
name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 失败时把出错的那几行做成一条注释（annotation）：运行页不登录也看得到，完整日志要登录才能看
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log || {
            msg=$(grep -B3 -A8 -E "✗|起不来|项失败" test-output.log | head -80 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=npm test 失败::${msg}"
            exit 1
          }

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe 需要完整历史
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 没配 CLOUDFLARE_API_TOKEN 就干净跳过，而不是让整个工作流变红。
      # fork 本仓库的人不会有这个密钥，他们的测试照跑，部署自动略过。
      - id: secret
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=${TOKEN:+yes}" >> "$GITHUB_OUTPUT"
      - if: steps.secret.outputs.present != 'yes'
        run: echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过部署（测试已全部通过）"
      - if: steps.secret.outputs.present == 'yes'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
