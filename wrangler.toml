name = "pigeon"
main = "src/index.ts"
compatibility_date = "2025-07-18"

# 配了 [[routes]] 之后 wrangler 默认会关掉 workers.dev 子域。
# 显式留着它当备用入口 —— .im 是马恩岛域名，国内访问不保险，
# 多一条不依赖该域名的通路值这一行配置。
workers_dev = true

# KV：存 channel:{key} → { deviceTokens, ... }
# 创建后把 id 填进来： wrangler kv namespace create PIGEON_KV
[[kv_namespaces]]
binding = "PIGEON_KV"
id = "af733559743842a99de21d71a70f7ec5"

[vars]
# ─────────────────────────────────────────────────────────────────────
# 全部来自你自己的 Apple 开发者账号（Team R4Q9M7H956）：
#   APNS_TOPIC   = iOS App 的 Bundle ID
#   APNS_KEY_ID  = Certificates, Identifiers & Profiles → Keys 里那把
#                  勾了 APNs 的密钥的 Key ID（10 位）
#   APNS_TEAM_ID = 右上角的 Team ID
# 自己部署时换成你自己的值，见 README「自建」一节。
# ─────────────────────────────────────────────────────────────────────
APNS_TOPIC   = "im.nfo.pigeon"
APNS_KEY_ID  = "J3PN796T84"
APNS_TEAM_ID = "R4Q9M7H956"

# 通知 category，需与 iOS App 里 UNNotificationCategory 的标识符一致。
# 通知内的操作按钮靠它注册。
APNS_CATEGORY = "pigeonNotification"

# APNS_KEY_P8 是私钥，不放这里。下载到的 .p8 只能下一次，存好，然后：
#   wrangler secret put APNS_KEY_P8 < AuthKey_XXXXXXXXXX.p8

# 自定义域名。custom_domain 会自动建好根域的 DNS 记录，不用手工加。
[[routes]]
pattern = "nfo.im"
custom_domain = true

# 限流：Workers 自带的限流绑定，按调用方给的键（通道 id、IP、账号 id）在单个节点内计数。
# 它是近似值、各节点独立 —— 用来挡住失控脚本和刷接口，不当作精确配额。
# namespace_id 是账号内自己起的编号，只要彼此不同即可。
[[unsafe.bindings]]
name = "RL_PUSH"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RL_ACCOUNT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# 发送令牌的每分钟上限：每个键一分钟只放一次，上限是 N 的令牌分 N 个格子轮着用（见 src/tokens.ts allowTokenPush）。
# 编号取 1040，不和别的限流绑定挨着，免得以后加绑定时撞号 —— 撞了号的两个绑定会共用计数
[[unsafe.bindings]]
name = "RL_TOKEN"
type = "ratelimit"
namespace_id = "1040"
simple = { limit = 1, period = 60 }

# 日志：Workers Logs。APNs 拒收、cron 出错这类事只有日志里看得到
[observability]
enabled = true

# 只留代码自己写下的出错信息，不要每个请求自动记一条：自动记的那条带着完整的请求地址，
# 而路径式推送的地址里就是推送 key 和消息内容。隐私政策承诺日志里没有这些（见 privacy.ts）
[observability.logs]
invocation_logs = false

# 两个 cron，scheduled() 按 event.cron 分派（见 src/watch.ts runCron）：
#   */5     整 5 分钟：网站监控和心跳
#   2-59/5  错开 2 分钟：补发重复提醒
# 分开是为了各自一次调用、各自一份额度（每次调用最多 1000 次 KV 操作）：
# 重复提醒排得再多，也挤不掉监控；反过来也一样
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *"]

# 本地 wrangler dev 按 routes 把请求地址报成 nfo.im。协议也照线上报成 https ——
# Worker 拒收明文 http 的接口请求（见 index.ts 的 plaintextResponse），报成 http 本地就什么都调不通了
[dev]
upstream_protocol = "https"
